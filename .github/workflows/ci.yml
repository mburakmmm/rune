name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NOX_VERSION: v2.0.27

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nox (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://noxlang.com/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install Nox (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://noxlang.com/install.ps1 | iex
          echo "$env:USERPROFILE\.nox-lang\bin" >> $env:GITHUB_PATH

      - name: Verify Nox Compiler
        run: |
          noxc version

      - name: Check Package & Typecheck
        run: |
          noxc check rune.nox
          noxc check main.nox

      - name: Run Test Suites
        run: |
          noxc test

      - name: Run Performance Benchmarks
        run: |
          noxc run benchmarks/run_benchmarks.nox
