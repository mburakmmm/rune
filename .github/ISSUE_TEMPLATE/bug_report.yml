name: Bug Report
description: Create a report to help us improve Rune
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Rune Version
      description: What version of Rune are you using? (Check nox.json or run `noxc list`)
      placeholder: "1.4.5"
    validations:
      required: true
  - type: input
    id: noxc_version
    attributes:
      label: Nox Compiler Version
      description: Run `noxc version` in your terminal and paste the output.
      placeholder: "noxc 2.0.27"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running on?
      options:
        - Linux (x86_64)
        - Linux (arm64 / aarch64)
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x86_64)
        - Windows 10/11 (Windows Terminal)
        - Windows (Command Prompt / ConHost)
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Paste a minimal Nox script reproducing the problem.
      render: nox
      placeholder: |
        import rune
        from rune import Console, Table
        
        # Code reproducing the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Error Message
      description: Paste terminal output or error messages if applicable.
      render: text
